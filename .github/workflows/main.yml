
name: Build NOUR OS

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare prototype
        run: |
          mkdir -p nour
          echo "NOUR OS prototype" > nour/README.txt
          echo "Linux-based operating system prototype" >> nour/README.txt

      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: nour-os-prototype
          path: nour/
